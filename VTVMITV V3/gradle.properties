# Dung lượng RAM cấp cho Gradle Daemon (2GB - 4GB tùy cấu hình RAM máy tính)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Bật chạy song song giữa các module/task
org.gradle.parallel=true

# Bật bộ nhớ đệm build nội bộ
org.gradle.caching=true

# Tắt tạm configuration-cache nếu gặp lỗi khi build Release APK
org.gradle.configuration-cache=false

# Chuẩn code style Kotlin
kotlin.code.style=official

# Bật hỗ trợ AndroidX và tối ưu R8
android.useAndroidX=true
android.enableR8.fullMode=true